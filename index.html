<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petanque scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}

/* ---------- Overlay board (designed on a 1920x1080 stage) ---------- */
.stage{position:relative;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.board{position:absolute;display:flex;flex-direction:column;color:var(--text);
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-variant-numeric:tabular-nums;
  transform:scale(var(--s));box-shadow:0 6px 24px rgba(0,0,0,.35)}
.board.p-tl{top:40px;left:40px;transform-origin:top left}
.board.p-tr{top:40px;right:40px;transform-origin:top right}
.board.p-bl{bottom:40px;left:40px;transform-origin:bottom left}
.board.p-br{bottom:40px;right:40px;transform-origin:bottom right}
.board.p-tc{top:40px;left:50%;transform:translateX(-50%) scale(var(--s));transform-origin:top center}
.board.p-bc{bottom:40px;left:50%;transform:translateX(-50%) scale(var(--s));transform-origin:bottom center}
.eventbar{background:var(--accent);color:var(--accentText);font-weight:700;font-size:30px;padding:6px 20px;white-space:nowrap}
.main{display:flex;background:var(--panel)}
.rows{display:flex;flex-direction:column;flex:1}
.row{display:flex;align-items:stretch;height:76px}
.row+.row{border-top:1px solid rgba(255,255,255,.1)}
.swatch{width:14px;background:var(--c);flex:none}
.name{flex:1;display:flex;align-items:center;padding:0 24px;font-size:46px;font-weight:600;white-space:nowrap;min-width:300px}
.bl{display:flex;align-items:center;gap:8px;padding:0 18px}
.dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--boule)}
.dot.on{background:var(--boule)}
.score{width:92px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--scoreBg);color:var(--scoreText);font-size:62px;font-weight:700}
.score.pop{animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.meta{display:flex;flex-direction:column;min-width:156px;border-left:1px solid rgba(255,255,255,.14)}
.mcell{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 20px;line-height:1}
.mcell+.mcell{border-top:1px solid rgba(255,255,255,.1)}
.mcell small{font-size:20px;font-weight:500;opacity:.75;margin-bottom:2px}
.mcell b{font-size:46px;font-weight:700}
.board .timer.done b{color:#ff6b6b;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}

body.overlay{background:transparent;overflow:hidden}
body.overlay #admin{display:none}
body.admin #overlayWrap{display:none}
#overlayWrap{position:fixed;inset:0;overflow:hidden}

/* ---------- Admin ---------- */
body.admin{background:#12161c;color:#e8edf2;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#admin{max-width:1180px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.top h1{font-size:20px;margin:0;font-weight:650;margin-right:auto}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;background:#243040;color:#b7c3d0}
.pill.live{background:#14361f;color:#7be39a}
.linkbox{display:flex;gap:6px}
.linkbox input{width:280px}
.preview{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;border:1px solid #2a3340;
  background:conic-gradient(#2b323c 25%,#232a33 0 50%,#2b323c 0 75%,#232a33 0) 0 0/28px 28px}
.preview .stage{position:absolute;left:0;top:0}
.grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(2,1fr)}
.card{background:#1a2029;border:1px solid #2a3340;border-radius:8px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650;color:#c9d3de}
.span2{grid-column:1/-1}
.teams{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);grid-column:1/-1}
.team{border-top:5px solid var(--c)}
.team.win .bigscore{color:#f2b705}
.line{display:flex;gap:8px;margin-bottom:6px}
.line input[type=text]{flex:1}
.bigscore{font-size:84px;font-weight:700;line-height:1;text-align:center;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px}
.sub{margin:14px 0 6px;color:#8a97a6;font-size:13px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-size:30px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
button{font:inherit;color:#e8edf2;background:#2a3544;border:1px solid #38465a;border-radius:6px;padding:10px 12px;cursor:pointer;min-height:44px}
button:hover{background:#34445a}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f2b705;outline-offset:2px}
button.primary{background:#f2b705;border-color:#f2b705;color:#1b1500;font-weight:650}
button.primary:hover{background:#ffc928}
button.danger{background:#3a1d22;border-color:#5b2a31}
button.minus{background:#2f2328}
input[type=text],input[type=number],select{font:inherit;color:#e8edf2;background:#0f1319;border:1px solid #38465a;border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
input[type=color]{width:44px;height:40px;padding:2px;background:#0f1319;border:1px solid #38465a;border-radius:6px;cursor:pointer}
input[type=range]{width:100%}
.timerbig{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:2px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.disp{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:8px;min-height:40px}
.tog{display:flex;gap:8px;align-items:center;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:#f2b705}
.muted{color:#8a97a6;font-size:13px}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.col{display:flex;gap:8px;align-items:center;font-size:13px;color:#b7c3d0}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:#8a97a6;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:820px){.grid,.teams{grid-template-columns:1fr}.linkbox input{width:100%}.colors{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.score.pop,.board .timer.done b{animation:none}}
</style>
</head>
<body>

<div id="overlayWrap"><div class="stage" id="mainStage"></div></div>
<div id="admin"></div>

<script>
(() => {
'use strict';
const MAX_SCORE = 13;
const KEY = 'petanque_state_v1';

const DEFAULT = {
  rev: 0,
  teams: [
    { name: 'Team A', score: 0, boules: 3, color: '#1f6feb' },
    { name: 'Team B', score: 0, boules: 3, color: '#d93a3a' }
  ],
  boulesMax: 3,
  end: 1,
  timer: { mode: 'down', duration: 3000000, elapsed: 0, startedAt: null },
  show: { event: true, names: true, scores: true, boules: true, end: true, timer: true },
  text: { event: 'Club Championship - Final', end: 'End', timer: 'Time' },
  style: {
    panel: '#0e1726', text: '#ffffff', accent: '#f2b705', accentText: '#1b1500',
    scoreBg: '#ffffff', scoreText: '#0e1726', boule: '#f2b705',
    opacity: 92, scale: 100, position: 'bl'
  }
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'), l = ks.pop(); ks.reduce((a, k) => a[k], o)[l] = v; };
const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function merge(base, over) {
  if (Array.isArray(base)) {
    return Array.isArray(over) ? over.map((o, i) => merge(base[i] !== undefined ? base[i] : base[0], o)) : base.map(x => merge(x, undefined));
  }
  if (base && typeof base === 'object') {
    const out = {};
    for (const k in base) out[k] = merge(base[k], over ? over[k] : undefined);
    return out;
  }
  return over === undefined || over === null ? base : over;
}

/* ---------- state + sync ---------- */
function loadLocal() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

let state = merge(DEFAULT, loadLocal());
let serverMode = false, offset = 0, seq = 0, postTimer = null, needPin = false, myPin = '';
const PINKEY = 'petanque_pin';
const params = new URLSearchParams(location.search);
const VIEW = params.get('view') || (/overlay/.test(location.pathname) ? 'overlay' : 'admin');
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('petanque_bc') : null;
const now = () => Date.now() + offset;

function normalize() {
  state.boulesMax = clamp(Math.round(Number(state.boulesMax)) || 1, 1, 6);
  state.end = Math.max(1, Math.round(Number(state.end)) || 1);
  state.teams.forEach(t => {
    t.score = clamp(Math.round(Number(t.score)) || 0, 0, MAX_SCORE);
    t.boules = clamp(Math.round(Number(t.boules)) || 0, 0, state.boulesMax);
  });
  state.timer.elapsed = Math.max(0, state.timer.elapsed || 0);
}

function commit() {
  if (serverMode && needPin && !myPin) { ensurePin(true).then(ok => { if (ok) location.reload(); }); return; }
  normalize();
  state.rev = Date.now() * 1000 + (seq++ % 1000);
  saveLocal();
  if (bc) bc.postMessage(state);
  if (serverMode) {
    clearTimeout(postTimer);
    postTimer = setTimeout(() => {
      fetch('/state', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Pin': myPin }, body: JSON.stringify(state) })
        .then(r => {
          if (r.status === 401) {
            myPin = ''; try { localStorage.removeItem(PINKEY); } catch {}
            updateStatus('PIN rejected - reload to re-enter');
          }
        }).catch(() => {});
    }, 30);
  }
  renderAll();
}

function receive(s) {
  if (!s || !s.rev || s.rev === state.rev) return;
  state = merge(DEFAULT, s);
  renderAll();
}

async function ensurePin(force) {
  let pin = force ? '' : (localStorage.getItem(PINKEY) || '');
  for (let i = 0; i < 3; i++) {
    if (pin) {
      const ok = await fetch('/check', { method: 'POST', headers: { 'X-Pin': pin } }).then(r => r.ok).catch(() => false);
      if (ok) { try { localStorage.setItem(PINKEY, pin); } catch {} myPin = pin; return true; }
    }
    pin = prompt(i ? 'Wrong PIN. Try again:' : 'Enter the admin PIN:') || '';
    if (!pin) break;
  }
  myPin = '';
  return false;
}

async function tryServer() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const t0 = Date.now();
    const r = await fetch('/time', { cache: 'no-store' });
    if (!r.ok) return;
    const st = await r.json();
    offset = st.now - (t0 + Date.now()) / 2;
    needPin = !!st.pin;
    const j = await (await fetch('/state', { cache: 'no-store' })).json();
    serverMode = true;
    if (VIEW === 'admin' && needPin && !(await ensurePin())) updateStatus('View only - PIN needed');
    if (j && j.rev) state = merge(DEFAULT, j);
    else if (VIEW === 'admin' && (!needPin || myPin)) commit();
    const es = new EventSource('/events');
    es.onmessage = e => { try { receive(JSON.parse(e.data)); } catch {} };
    es.onopen = () => updateStatus();
    es.onerror = () => updateStatus('Reconnecting...');
    updateStatus();
    renderAll();
  } catch {}
}

/* ---------- overlay rendering ---------- */
const boards = [];

function fmtClock(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function timerMs(t) { return (t.elapsed || 0) + (t.startedAt ? now() - t.startedAt : 0); }
function timerText(s) {
  const t = s.timer, ms = timerMs(t);
  return t.mode === 'up' ? fmtClock(Math.floor(ms / 1000)) : fmtClock(Math.ceil((t.duration - ms) / 1000));
}
function timerDone(s) { const t = s.timer; return t.mode === 'down' && timerMs(t) >= t.duration; }

function dots(n, max) {
  let h = '';
  for (let i = 0; i < max; i++) h += `<i class="dot${i < n ? ' on' : ''}"></i>`;
  return h;
}

function boardHTML(s) {
  const sh = s.show, tx = s.text;
  const rows = s.teams.map((t, i) =>
    `<div class="row" style="--c:${esc(t.color)}"><i class="swatch"></i>` +
    (sh.names ? `<span class="name">${esc(t.name)}</span>` : '') +
    (sh.boules ? `<span class="bl">${dots(t.boules, s.boulesMax)}</span>` : '') +
    (sh.scores ? `<span class="score" data-i="${i}">${t.score}</span>` : '') +
    `</div>`).join('');
  const meta = [];
  if (sh.end) meta.push(`<div class="mcell"><small>${esc(tx.end)}</small><b>${s.end}</b></div>`);
  if (sh.timer) meta.push(`<div class="mcell timer${timerDone(s) ? ' done' : ''}"><small>${esc(tx.timer)}</small><b class="tval">${timerText(s)}</b></div>`);
  return (sh.event && tx.event ? `<div class="eventbar">${esc(tx.event)}</div>` : '') +
    `<div class="main"><div class="rows">${rows}</div>${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}</div>`;
}

function mountBoard(stage) {
  const el = document.createElement('div');
  stage.appendChild(el);
  const b = { el, prev: null };
  boards.push(b);
  return b;
}

function renderBoard(b) {
  const s = state, st = s.style, el = b.el;
  el.className = 'board p-' + st.position;
  const v = {
    '--s': st.scale / 100, '--panel': rgba(st.panel, st.opacity / 100), '--text': st.text,
    '--accent': st.accent, '--accentText': st.accentText, '--scoreBg': st.scoreBg,
    '--scoreText': st.scoreText, '--boule': st.boule
  };
  for (const k in v) el.style.setProperty(k, v[k]);
  el.innerHTML = boardHTML(s);
  if (b.prev) {
    s.teams.forEach((t, i) => {
      if (t.score !== b.prev[i]) { const n = $(`.score[data-i="${i}"]`, el); if (n) n.classList.add('pop'); }
    });
  }
  b.prev = s.teams.map(t => t.score);
}

function fit(stage) {
  const w = stage.parentElement;
  const k = Math.min(w.clientWidth / 1920, w.clientHeight / 1080);
  stage.style.transform = `scale(${k})`;
}

function tick() {
  const txt = timerText(state), done = timerDone(state);
  $$('.tval').forEach(e => { if (e.textContent !== txt) e.textContent = txt; });
  $$('.board .timer').forEach(e => e.classList.toggle('done', done));
}

/* ---------- admin UI ---------- */
const tog = (path, label) => `<label class="tog"><input type="checkbox" data-path="${path}" data-type="bool"><span>${label}</span></label>`;
const colour = (path, label) => `<label class="col"><input type="color" data-path="${path}"><span>${label}</span></label>`;

function teamCard(i) {
  const steps = [1, 2, 3, 4, 5, 6].map(n => `<button class="primary" data-act="score" data-team="${i}" data-n="${n}">+${n}</button>`).join('');
  return `<section class="card team" data-team="${i}">
    <div class="line"><input type="text" data-path="teams.${i}.name" aria-label="Team ${i + 1} name"><input type="color" data-path="teams.${i}.color" aria-label="Team ${i + 1} colour"></div>
    <div class="bigscore" data-text="teams.${i}.score">0</div>
    <div class="btns">${steps}<button class="minus" data-act="score" data-team="${i}" data-n="-1">-1</button></div>
    <div class="sub">Boules left</div>
    <div class="stepper">
      <button class="minus" data-act="boule" data-team="${i}" data-n="-1" aria-label="Boule thrown">-</button>
      <b data-text="teams.${i}.boules">0</b>
      <button data-act="boule" data-team="${i}" data-n="1" aria-label="Add a boule">+</button>
    </div>
  </section>`;
}

function buildAdmin() {
  $('#admin').innerHTML = `
  <div class="top">
    <h1>Petanque scoreboard</h1>
    <span class="pill" id="status"></span>
    <div class="linkbox"><input type="text" id="ovlink" readonly aria-label="Overlay link"><button id="copy">Copy overlay link</button></div>
  </div>
  <div class="preview" id="previewWrap"><div class="stage" id="previewStage"></div></div>

  <div class="grid">
    <div class="teams">${teamCard(0)}${teamCard(1)}</div>

    <section class="card">
      <h2>End</h2>
      <div class="stepper">
        <button class="minus" data-act="end" data-n="-1" aria-label="Previous end">-</button>
        <b data-text="end">1</b>
        <button data-act="end" data-n="1" aria-label="Next end number">+</button>
        <button class="primary" data-act="nextEnd" style="margin-left:auto">Next end (reset boules)</button>
      </div>
      <div class="sub">Quick actions</div>
      <div class="actions">
        <button data-act="resetBoules">Reset boules</button>
        <button data-act="swap">Swap teams</button>
        <button class="danger" data-act="newGame">New game</button>
      </div>
    </section>

    <section class="card">
      <h2>Timer</h2>
      <div class="timerbig tval">00:00</div>
      <div class="btns" style="grid-template-columns:repeat(4,1fr)">
        <button class="primary" id="tbtn" data-act="timerToggle">Start</button>
        <button data-act="timerReset">Reset</button>
        <button data-act="timerAdj" data-n="-60">-1:00</button>
        <button data-act="timerAdj" data-n="60">+1:00</button>
      </div>
      <div class="two" style="margin-top:10px">
        <div class="field"><label for="tmode">Direction</label>
          <select id="tmode" data-path="timer.mode"><option value="down">Count down</option><option value="up">Count up</option></select></div>
        <div class="field"><label for="tdur">Countdown length (mm:ss)</label><input type="text" id="tdur" inputmode="numeric"></div>
      </div>
    </section>

    <section class="card">
      <h2>Show on stream</h2>
      <div class="disp">${tog('show.event', 'Event name')}<input type="text" data-path="text.event" aria-label="Event name text"></div>
      <div class="disp">${tog('show.names', 'Team names')}<span class="muted">Edit names in the team cards</span></div>
      <div class="disp">${tog('show.scores', 'Scores')}<span class="muted">0 to ${MAX_SCORE}</span></div>
      <div class="disp">${tog('show.boules', 'Boule counter')}<span class="muted">Dots show boules left</span></div>
      <div class="disp">${tog('show.end', 'End number')}<input type="text" data-path="text.end" aria-label="End label"></div>
      <div class="disp">${tog('show.timer', 'Timer')}<input type="text" data-path="text.timer" aria-label="Timer label"></div>
    </section>

    <section class="card">
      <h2>Look</h2>
      <div class="colors">
        ${colour('style.panel', 'Panel')}${colour('style.text', 'Text')}${colour('style.accent', 'Event bar')}
        ${colour('style.accentText', 'Event text')}${colour('style.scoreBg', 'Score box')}${colour('style.scoreText', 'Score digits')}
        ${colour('style.boule', 'Boule dots')}
      </div>
      <div class="two">
        <div class="field"><label for="pos">Position</label>
          <select id="pos" data-path="style.position">
            <option value="bl">Bottom left</option><option value="br">Bottom right</option><option value="bc">Bottom centre</option>
            <option value="tl">Top left</option><option value="tr">Top right</option><option value="tc">Top centre</option>
          </select></div>
        <div class="field"><label for="bmax">Boules per team</label><input type="number" id="bmax" min="1" max="6" data-path="boulesMax" data-type="num"></div>
      </div>
      <div class="field"><label for="scale">Size</label><input type="range" id="scale" min="50" max="200" data-path="style.scale" data-type="num"></div>
      <div class="field"><label for="opac">Panel opacity</label><input type="range" id="opac" min="0" max="100" data-path="style.opacity" data-type="num"></div>
    </section>
  </div>`;
}

function updateStatus(text) {
  const el = $('#status'); if (!el) return;
  el.textContent = text || (serverMode ? 'Live - server sync' : 'Local sync (same browser or OBS only)');
  el.classList.toggle('live', serverMode && !text);
  const link = $('#ovlink');
  if (link) link.value = serverMode ? location.origin + '/overlay' : location.href.split('?')[0].split('#')[0] + '?view=overlay';
}

function syncAdmin() {
  $$('[data-path]').forEach(el => {
    if (el === document.activeElement) return;
    const v = getPath(state, el.dataset.path);
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  });
  $$('[data-text]').forEach(el => { el.textContent = getPath(state, el.dataset.text); });
  $$('.team').forEach(el => {
    const t = state.teams[+el.dataset.team];
    el.style.setProperty('--c', t.color);
    el.classList.toggle('win', t.score >= MAX_SCORE);
  });
  const td = $('#tdur');
  if (td && td !== document.activeElement) td.value = fmtClock(Math.round(state.timer.duration / 1000));
  const tb = $('#tbtn'); if (tb) tb.textContent = state.timer.startedAt ? 'Pause' : 'Start';
}

function parseClock(str) {
  const p = String(str).trim().split(':').map(Number);
  if (!p.length || p.some(isNaN)) return null;
  if (p.length === 1) return p[0] * 60;
  if (p.length === 2) return p[0] * 60 + p[1];
  return p[0] * 3600 + p[1] * 60 + p[2];
}

function act(a, el) {
  const i = +el.dataset.team, n = +el.dataset.n, t = state.timer;
  switch (a) {
    case 'score': state.teams[i].score += n; break;
    case 'boule': state.teams[i].boules += n; break;
    case 'end': state.end += n; break;
    case 'nextEnd': state.end += 1; state.teams.forEach(x => x.boules = state.boulesMax); break;
    case 'resetBoules': state.teams.forEach(x => x.boules = state.boulesMax); break;
    case 'swap': state.teams.reverse(); break;
    case 'newGame':
      if (!confirm('Start a new game? Scores, end number, boules and timer will reset.')) return;
      state.teams.forEach(x => { x.score = 0; x.boules = state.boulesMax; });
      state.end = 1; t.elapsed = 0; t.startedAt = null; break;
    case 'timerToggle':
      if (t.startedAt) { t.elapsed += now() - t.startedAt; t.startedAt = null; } else t.startedAt = now();
      break;
    case 'timerReset': t.elapsed = 0; t.startedAt = null; break;
    case 'timerAdj': t.elapsed += (t.mode === 'down' ? -n : n) * 1000; break;
    default: return;
  }
  commit();
}

function bindAdmin() {
  const admin = $('#admin');
  admin.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b) act(b.dataset.act, b);
  });
  const onEdit = e => {
    const el = e.target;
    if (el.id === 'tdur') {
      if (e.type !== 'change') return;
      const s = parseClock(el.value);
      if (s !== null && s > 0) { state.timer.duration = s * 1000; commit(); }
      el.value = fmtClock(Math.round(state.timer.duration / 1000));
      return;
    }
    const path = el.dataset && el.dataset.path;
    if (!path) return;
    const live = el.type === 'checkbox' || el.tagName === 'SELECT' ? e.type === 'change' : e.type === 'input';
    if (!live) return;
    let v;
    if (el.dataset.type === 'bool') v = el.checked;
    else if (el.dataset.type === 'num') { v = Number(el.value); if (el.value === '' || isNaN(v)) return; }
    else v = el.value;
    setPath(state, path, v);
    commit();
  };
  admin.addEventListener('input', onEdit);
  admin.addEventListener('change', onEdit);
  $('#copy').addEventListener('click', async () => {
    const inp = $('#ovlink');
    try { await navigator.clipboard.writeText(inp.value); } catch { inp.select(); document.execCommand('copy'); }
    const b = $('#copy'); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy overlay link', 1500);
  });
}

/* ---------- render ---------- */
function renderAll() {
  boards.forEach(renderBoard);
  if (VIEW === 'admin') syncAdmin();
  tick();
}

/* ---------- boot ---------- */
function boot() {
  document.body.classList.add(VIEW === 'overlay' ? 'overlay' : 'admin');
  if (VIEW === 'admin') {
    buildAdmin();
    bindAdmin();
    mountBoard($('#previewStage'));
    fit($('#previewStage'));
    updateStatus();
  } else {
    mountBoard($('#mainStage'));
    fit($('#mainStage'));
  }
  addEventListener('resize', () => fit($(VIEW === 'admin' ? '#previewStage' : '#mainStage')));

  // local sync: BroadcastChannel + storage events + slow poll fallback
  if (bc) bc.onmessage = e => receive(e.data);
  addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { receive(JSON.parse(e.newValue)); } catch {} } });
  setInterval(() => { if (!serverMode) { const s = loadLocal(); if (s) receive(s); } }, 700);

  renderAll();
  setInterval(tick, 200);
  tryServer();
}
boot();
})();
</script>
